<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>카운트온 현황 조회 (게스트)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> select, input[type="date"] { font-size: 16px !important; } html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; } </style>
</head>
<body class="bg-gray-100 p-2 sm:p-4 md:p-8 relative mt-4">

    <div id="cloudStatus" class="fixed top-0 left-0 w-full bg-red-500 text-white text-xs font-bold text-center py-1 z-50 transition-colors">
        🔴 서버 연결 중...
    </div>

    <div class="max-w-5xl mx-auto bg-white p-3 sm:p-5 md:p-6 rounded-lg shadow-lg border-t-4 border-indigo-500 mt-2">
        <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <h1 class="text-lg sm:text-2xl font-bold text-gray-800 flex items-center gap-2">📦 카운트온 실시간 현황판</h1>
            <div class="flex gap-2">
                <span class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-bold border flex items-center">게스트</span>
            </div>
        </div>

        <div class="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-xl p-4 sm:p-6 mb-5 text-white shadow-md">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-3 pb-3 border-b border-blue-600 gap-2">
                <h2 class="text-base sm:text-lg font-bold flex items-center gap-2">📊 월별 통합 정산 내역</h2>
                <select id="monthSelector" onchange="handleMonthChange()" class="bg-blue-900 text-white font-bold border border-blue-500 rounded-md px-3 py-1.5 focus:outline-none"></select>
            </div>
            <div class="mb-4">
                <h3 class="text-xs font-semibold text-blue-200 mb-1">선택한 월 합산 금액</h3>
                <div class="text-3xl font-extrabold"><span id="monthlyTotalRevenue">0</span> <span class="text-base font-normal opacity-80">원</span></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 bg-black bg-opacity-20 p-3 rounded-lg">
                <div onclick="openStorageModal()" class="flex justify-between sm:block cursor-pointer hover:bg-black hover:bg-opacity-10 p-1.5 rounded transition">
                    <p class="text-xs text-blue-200 mb-1">📦 보관료 🔍</p><p class="text-base font-bold"><span id="monthlyStorageFee">0</span> 원</p>
                </div>
                <div class="flex justify-between sm:block border-t sm:border-t-0 border-blue-600 border-opacity-30 pt-2 sm:pt-0 pl-1.5">
                    <p class="text-xs text-blue-200 mb-1">🚚 택배비 (출고)</p><p class="text-base font-bold"><span id="monthlyOutFee">0</span> 원</p>
                </div>
                <div class="flex justify-between sm:block border-t sm:border-t-0 border-blue-600 border-opacity-30 pt-2 sm:pt-0 pl-1.5">
                    <p class="text-xs text-blue-200 mb-1">📥 입고비</p><p class="text-base font-bold"><span id="monthlyInFee">0</span> 원</p>
                </div>
            </div>
        </div>

        <div class="mb-3 flex justify-between items-center"><h3 class="text-base font-bold text-gray-800">📋 현재고 현황</h3><span class="text-xs bg-amber-50 px-3 py-1.5 rounded-md border border-amber-200 font-bold" id="todayPltBadge">총 0 PLT</span></div>
        <div class="hidden md:block overflow-x-auto mb-6"><table class="w-full text-left bg-white border rounded"><thead class="bg-gray-800 text-white text-sm"><tr><th class="p-3">품목명</th><th class="p-3 text-right">현재고 (박스)</th><th class="p-3 text-right">현재고 (낱개)</th><th class="p-3 text-center">규격 (1PLT)</th><th class="p-3 text-center">보관 PLT</th></tr></thead><tbody id="inventoryTable" class="divide-y"></tbody></table></div>
        <div id="inventoryCards" class="md:hidden grid gap-2 mb-6"></div>

        <div>
            <div class="flex flex-col gap-2 mb-3"><h3 class="text-base font-bold text-gray-800">🔍 <span id="logTitleMonth" class="text-blue-600"></span> 상세 내역</h3>
                <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border">
                    <input type="date" id="searchDate" class="border p-1.5 text-sm rounded flex-1" onchange="render()"><button onclick="document.getElementById('searchDate').value=''; render()" class="text-xs bg-gray-200 px-3 py-1.5 rounded font-bold">전체보기</button>
                </div>
            </div>
            <div id="logContainer" class="bg-gray-50 p-3 rounded-lg max-h-96 overflow-y-auto text-sm border shadow-inner"></div>
        </div>
    </div>

    <div id="storageModal" style="display:none;" class="fixed inset-0 bg-black bg-opacity-60 items-center justify-center z-50 p-3"><div class="bg-white p-4 sm:p-6 rounded-xl w-full max-w-md max-h-[85vh] flex flex-col"><h2 id="storageModalTitle" class="text-lg font-bold mb-3 border-b pb-2">📋 보관료 내역</h2><div class="flex-1 overflow-y-auto mb-4 border rounded"><table class="w-full text-left text-sm"><thead class="bg-gray-100 border-b sticky top-0 shadow-sm"><tr><th class="p-2.5">날짜</th><th class="p-2.5 text-center">보관(PLT)</th><th class="p-2.5 text-right">금액</th></tr></thead><tbody id="storageModalBody" class="divide-y text-gray-600"></tbody></table></div><div class="flex justify-end pt-1"><button onclick="closeStorageModal()" class="bg-gray-800 text-white px-5 py-2 rounded-md text-sm font-semibold">닫기</button></div></div></div>

    <script>
        const FIREBASE_URL = "https://ts3pl-982ef-default-rtdb.firebaseio.com/ts3pl_data.json"; 

        let inventory = []; let logs = []; let dailyPltLog = {}; let currentSelectedMonth = "";
        function getFormattedDate(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

        // ✅ 3초마다 데이터를 확인하여 무조건 안정적으로 동기화하는 방식으로 변경
        function fetchCloudData() {
            fetch(FIREBASE_URL, { cache: "no-cache" })
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        inventory = data.inventory || [];
                        logs = data.logs || [];
                        dailyPltLog = data.dailyPltLog || {};
                        
                        const status = document.getElementById('cloudStatus');
                        status.innerText = "🟢 실시간 정상 동기화 중 (자동)";
                        status.className = "fixed top-0 left-0 w-full bg-emerald-500 text-white text-xs font-bold text-center py-1 z-50 transition-colors";
                    } else {
                        const status = document.getElementById('cloudStatus');
                        status.innerText = "🟡 서버에 아직 데이터가 없습니다 (관리자에서 먼저 작업해주세요)";
                        status.className = "fixed top-0 left-0 w-full bg-yellow-500 text-white text-xs font-bold text-center py-1 z-50 transition-colors";
                    }
                    render();
                })
                .catch(err => {
                    console.error("Firebase 로드 실패", err);
                    const status = document.getElementById('cloudStatus');
                    status.innerText = "🔴 통신 오류 (권한 문제이거나 인터넷 연결 확인)";
                    status.className = "fixed top-0 left-0 w-full bg-red-500 text-white text-xs font-bold text-center py-1 z-50 transition-colors";
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            currentSelectedMonth = getFormattedDate().substring(0, 7);
            fetchCloudData(); // 처음 1번 로드
            setInterval(fetchCloudData, 3000); // 3초 간격으로 무한 업데이트
        });

        function handleMonthChange() { currentSelectedMonth = document.getElementById('monthSelector').value; document.getElementById('searchDate').value = ''; render(); }
        function openStorageModal() { const [year, month] = currentSelectedMonth.split('-'); document.getElementById('storageModalTitle').innerText = `📊 ${year}년 ${parseInt(month)}월 보관비`; const tbody = document.getElementById('storageModalBody'); tbody.innerHTML = ''; const sortedDates = Object.keys(dailyPltLog).filter(date => date.startsWith(currentSelectedMonth)).sort(); if (sortedDates.length === 0) { tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center">데이터 없음</td></tr>`; } else { tbody.innerHTML = sortedDates.map(date => { const plt = dailyPltLog[date] || 0; const fee = plt * 700; return `<tr class="border-b"><td class="p-2.5">${date}</td><td class="p-2.5 text-center font-bold">${plt} PLT</td><td class="p-2.5 text-right font-bold text-indigo-600">${fee.toLocaleString()} 원</td></tr>`; }).join(''); } document.getElementById('storageModal').style.display = 'flex'; }
        function closeStorageModal() { document.getElementById('storageModal').style.display = 'none'; }

        function render() {
            if(inventory.length === 0) {
                document.getElementById('inventoryTable').innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">데이터가 없습니다.</td></tr>`;
                document.getElementById('inventoryCards').innerHTML = `<div class="p-4 text-center text-gray-400 border rounded bg-white">데이터가 없습니다.</div>`;
                document.getElementById('logContainer').innerHTML = `<div class="p-4 text-center text-gray-400">내역 없음</div>`;
                return;
            }

            let totalPlt = 0;
            document.getElementById('inventoryTable').innerHTML = inventory.map(item => { const plt = Math.ceil(item.box / item.pltStd); totalPlt += plt; return `<tr class="border-b hover:bg-gray-50"><td class="p-3 font-bold text-gray-800">${item.name}</td><td class="p-3 text-right font-mono text-blue-600 font-bold">${item.box} box</td><td class="p-3 text-right font-mono text-gray-500">${item.pcs} 개</td><td class="p-3 text-center text-xs text-gray-500">${item.pltStd}박스</td><td class="p-3 text-center"><span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold border border-indigo-100">${plt} PLT</span></td></tr>`; }).join('');
            document.getElementById('inventoryCards').innerHTML = inventory.map(item => { const plt = Math.ceil(item.box / item.pltStd); return `<div class="bg-white border rounded-lg shadow-sm p-3"><div class="flex justify-between mb-2"><h4 class="font-bold">${item.name}</h4><span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full text-xs font-bold border border-indigo-200">${plt} PLT</span></div><div class="grid grid-cols-2 gap-2"><div class="bg-blue-50 border border-blue-100 rounded px-2 py-1.5"><p class="text-[10px] text-blue-700 font-bold">박스</p><p class="font-mono text-blue-700 font-bold">${item.box}</p></div><div class="bg-gray-50 border border-gray-100 rounded px-2 py-1.5"><p class="text-[10px] text-gray-500 font-bold">낱개</p><p class="font-mono text-gray-700 font-bold">${item.pcs}</p></div></div></div>`; }).join('');
            document.getElementById('todayPltBadge').innerText = `현재 ${totalPlt} PLT`;

            const availableMonths = new Set(); logs.forEach(l => availableMonths.add(l.time.substring(0, 7))); Object.keys(dailyPltLog).forEach(d => availableMonths.add(d.substring(0, 7)));
            const sortedMonths = Array.from(availableMonths).sort().reverse();
            if (!sortedMonths.includes(currentSelectedMonth) && sortedMonths.length>0) currentSelectedMonth = sortedMonths[0];
            document.getElementById('monthSelector').innerHTML = sortedMonths.map(m => `<option value="${m}" ${m === currentSelectedMonth ? 'selected' : ''}>${m.split('-')[0]}년 ${m.split('-')[1]}월 내역</option>`).join('');
            document.getElementById('logTitleMonth').innerText = currentSelectedMonth.replace('-', '.');

            let mInFee = 0, mOutFee = 0, mStorageFee = 0;
            logs.forEach(log => { if (log.time.startsWith(currentSelectedMonth)) { if (log.type === 'IN') mInFee += (log.fee||0); if (log.type === 'OUT') mOutFee += (log.fee||0); }});
            Object.keys(dailyPltLog).forEach(dateKey => { if (dateKey.startsWith(currentSelectedMonth)) mStorageFee += (dailyPltLog[dateKey]||0) * 700; });
            document.getElementById('monthlyStorageFee').innerText = mStorageFee.toLocaleString(); document.getElementById('monthlyInFee').innerText = mInFee.toLocaleString(); document.getElementById('monthlyOutFee').innerText = mOutFee.toLocaleString(); document.getElementById('monthlyTotalRevenue').innerText = (mInFee + mOutFee + mStorageFee).toLocaleString();

            const searchDate = document.getElementById('searchDate').value; const filteredLogs = searchDate ? logs.filter(l => l.time.startsWith(searchDate)) : logs.filter(l => l.time.startsWith(currentSelectedMonth));
            document.getElementById('logContainer').innerHTML = filteredLogs.length === 0 ? `<div class="p-4 text-center text-gray-400">내역 없음</div>` : filteredLogs.map(log => { const isOut = log.type === 'OUT'; return `<div class="p-3 bg-white border-l-4 ${isOut?'border-blue-400':'border-green-400'} mb-2 rounded shadow-sm"><div><p class="${isOut?'text-blue-700':'text-green-700'} font-bold text-sm">${log.text}</p><p class="text-xs text-gray-400 mt-1">${log.time}</p></div>${log.memo ? `<p class="text-xs text-gray-600 mt-2 bg-gray-50 p-1.5 rounded">📝 ${log.memo}</p>` : ''}</div>`; }).join('');
        }
    </script>
</body>
</html>
